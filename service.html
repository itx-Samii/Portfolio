<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detailed overview of NexusTech's premium software services, including AI chatbots, offline applications, cloud SaaS, and bespoke animated websites.">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Service Details | NexusTech Agency">
  <meta property="og:description" content="Explore custom engineering details, timelines, and estimation costs for our premium services.">
  <meta property="og:image" content="https://nexustech.agency/assets/og-image.jpg">

  <title>Service Details - NexusTech</title>
  
  <!-- Font Preconnections for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="index.css">
  <style>
    .service-detail-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8rem 5% 4rem 5%;
      max-width: 1400px;
      margin: 0 auto;
      gap: 4rem;
    }
    
    .detail-content {
      flex: 1.2;
      max-width: 700px;
    }

    .detail-3d {
      flex: 0.8;
      height: 60vh;
      position: relative;
      background: rgba(7, 7, 11, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #detail-canvas {
      width: 100%;
      height: 100%;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 2rem;
      transition: var(--transition-smooth);
    }

    .back-home:hover {
      color: var(--accent-cyan);
    }

    .feature-list {
      margin: 2.5rem 0;
      list-style: none;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .feature-item svg {
      color: var(--accent-cyan);
    }

    .price-box {
      background: rgba(0, 243, 255, 0.02);
      border: 1px solid rgba(0, 243, 255, 0.15);
      padding: 1.5rem 2rem;
      border-radius: 4px;
      margin-top: 2rem;
      display: inline-block;
    }

    .price-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .price-label {
      color: var(--text-secondary);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    @media (max-width: 968px) {
      .service-detail-container {
        flex-direction: column;
        padding-top: 8rem;
      }
      .detail-3d {
        width: 100%;
        height: 40vh;
      }
    }
  </style>
</head>
<body>

  <!-- Custom Cursor Elements -->
  <div class="custom-cursor" id="cursor"></div>
  <div class="custom-cursor-dot" id="cursor-dot"></div>

  <!-- Ambient background elements -->
  <div class="ambient-bg"></div>
  <div class="ambient-grid"></div>

  <!-- Navbar -->
  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <div class="logo">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span>Nexus</span>Tech
      </div>
      <ul class="nav-links">
        <li><a href="index.html#hero">Home</a></li>
        <li><a href="index.html#services">Services</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
      <div class="controls-group">
        <button class="lang-btn" id="lang-toggle" aria-label="Toggle language between English and Roman Urdu">English</button>
        <a href="index.html#contact" class="contact-btn" aria-label="Get in Touch with NexusTech">Get in Touch</a>
      </div>
    </nav>
  </header>

  <!-- Service Detail Section -->
  <main class="service-detail-container">
    <div class="detail-content">
      <a href="index.html#services" class="back-home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span id="back-txt">Back to Services</span>
      </a>
      
      <span class="hero-tag" id="service-tag">Service Detail</span>
      <h1 class="hero-title" id="service-title">Loading...</h1>
      <p class="hero-desc" id="service-desc">Loading details...</p>
      
      <ul class="feature-list" id="feature-list">
        <!-- Dyn injected -->
      </ul>

      <div class="price-box">
        <span class="price-label" id="price-label">ESTIMATED TIMELINE & COST</span>
        <div class="price-value" id="service-price">...</div>
      </div>
      
      <div style="margin-top: 3rem;">
        <a href="index.html#contact" class="contact-btn" id="cta-book">Hire Us For This Project</a>
      </div>
    </div>

    <div class="detail-3d">
      <canvas id="detail-canvas"></canvas>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 NexusTech. All rights reserved.</p>
  </footer>

  <!-- ThreeJS scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <script>
    // Data dictionary for services
    const serviceData = {
      chatbot: {
        en: {
          tag: "Automated Interaction",
          title: "AI Chatbots & Agents",
          desc: "Supercharge your user support and operations with AI chatbots built on advanced LLMs. We configure conversational flows, custom database actions, and automated CRM pipelines that answer customer queries in milliseconds.",
          features: ["24/7 customer queries automated", "Natural conversation workflows", "Custom knowledge base connection", "CRM/Slack/Email integrations"],
          price: "Starts at $800 | 2-3 Weeks",
          back: "Back to Home",
          cta: "Build AI Chatbot"
        },
        ru: {
          tag: "Automated Interaction",
          title: "AI Chatbots & Agents",
          desc: "Apni customer support aur operational tasks ko automate karein smart AI chatbots ke saath. Hum custom flow patterns, direct database queries, aur automated CRM pipelines integrate karte hain jo milliseconds mein reply dete hain.",
          features: ["24/7 customer support automation", "Behtareen natural flow conversation", "Aapki product knowledge base integration", "CRM/Slack/Email integrations"],
          price: "Starts at $800 | 2-3 Weeks",
          back: "Ghar Wapis",
          cta: "Chatbot Banwayen"
        },
        geometry: 'sphere'
      },
      offline: {
        en: {
          tag: "Hardware Performance",
          title: "Offline Desktop Softwares",
          desc: "Fast, localized desktop programs designed for POS, accountancy, or utility workflows. Runs 100% offline, guaranteeing sub-millisecond execution speeds, maximum privacy protection, and zero monthly server hosting fees.",
          features: ["Runs without internet dependency", "Full hardware execution speed", "Secure local database storage", "No monthly hosting or server costs"],
          price: "Starts at $1,200 | 3-4 Weeks",
          back: "Back to Home",
          cta: "Build Desktop Software"
        },
        ru: {
          tag: "Hardware Performance",
          title: "Offline Desktop Softwares",
          desc: "Muzboot aur tezi se chalne wale desktop applications, jo security aur high execution speed dete hain. POS, business ledgers aur inventory management ke liye best hain, bina kisi internet dependence ke.",
          features: ["Bina internet ke operate karein", "Behtareen hardware speed aur utility", "Secure local storage database", "Zero monthly hosting expenses"],
          price: "Starts at $1,200 | 3-4 Weeks",
          back: "Ghar Wapis",
          cta: "Desktop App Banwayen"
        },
        geometry: 'cube'
      },
      online: {
        en: {
          tag: "Global Cloud Services",
          title: "Online Softwares & SaaS",
          desc: "Secure web-based software applications allowing your team or public users to access and sync records globally. Optimized with real-time webhooks, serverless scale capabilities, and robust security protocols.",
          features: ["Global real-time syncing", "Secure multi-user permissions", "Cloud hosting scaling support", "Advanced API webhooks"],
          price: "Starts at $2,000 | 4-6 Weeks",
          back: "Back to Home",
          cta: "Build Online SaaS"
        },
        ru: {
          tag: "Global Cloud Services",
          title: "Online Softwares & SaaS",
          desc: "Mehfooz web applications jo aapki inventory ya user management ko globally online sync karti hain. Real-time webhooks aur multitenant permission settings ke sath banayi jati hain.",
          features: ["Globally real-time data synchronization", "Multi-user authentication scales", "Automated backup controls", "Integration with API webhooks"],
          price: "Starts at $2,000 | 4-6 Weeks",
          back: "Ghar Wapis",
          cta: "Online Software Banwayen"
        },
        geometry: 'cylinder'
      },
      websites: {
        en: {
          tag: "Brand Authority",
          title: "Websites & Animations",
          desc: "High converting marketing landing pages, corporate websites, and immersive 3D/2D animation-heavy landing pages built to load instantly. We integrate Three.js, custom shader elements, and smooth scroll-scrubbing animations to keep users engaged and convert visitors into customers.",
          features: ["Ultra-fast loading speeds (Under 1s)", "WebGL 3D rendering & animations", "100% Mobile & tablet responsive flow", "On-page SEO & analytics trackers"],
          price: "Starts at $900 | 2-3 Weeks",
          back: "Back to Home",
          cta: "Build Websites & Animations"
        },
        ru: {
          tag: "Brand Authority",
          title: "Websites & Animations",
          desc: "Google search engine rank karne wali fast business websites aur immersive 3D/2D animation-heavy landing pages. Three.js, custom shaders, aur smooth scroll storytelling animations jo user retention ko barhati hain.",
          features: ["Super-fast page speed (Under 1s)", "Interactive 3D WebGL features", "Responsive layout on all devices", "SEO integration & analytics track"],
          price: "Starts at $900 | 2-3 Weeks",
          back: "Ghar Wapis",
          cta: "Website & Animations Banwayen"
        },
        geometry: 'knot'
      }
    };

    // Load active service
    const urlParams = new URLSearchParams(window.location.search);
    const serviceId = urlParams.get('id') || 'chatbot';
    const activeService = serviceData[serviceId] || serviceData.chatbot;

    let currentLang = localStorage.getItem("lang") || "en";

    function updateContent(lang) {
      currentLang = lang;
      localStorage.setItem("lang", lang);
      
      const btn = document.getElementById("lang-toggle");
      if (btn) btn.textContent = lang === "en" ? "Roman Urdu" : "English";

      const data = activeService[lang];
      document.getElementById("service-tag").textContent = data.tag;
      document.getElementById("service-title").textContent = data.title;
      document.getElementById("service-desc").textContent = data.desc;
      document.getElementById("service-price").textContent = data.price;
      document.getElementById("back-txt").textContent = data.back;
      document.getElementById("cta-book").textContent = data.cta;

      // Update list
      const list = document.getElementById("feature-list");
      list.innerHTML = "";
      data.features.forEach(feat => {
        const item = document.createElement("li");
        item.className = "feature-item";
        item.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>${feat}</span>
        `;
        list.appendChild(item);
      });
    }

    // Init language switcher
    document.addEventListener("DOMContentLoaded", () => {
      updateContent(currentLang);
      document.getElementById("lang-toggle").addEventListener("click", () => {
        const next = currentLang === "en" ? "ru" : "en";
        updateContent(next);
      });
    });

    // Custom Cursor tracking
    const cursor = document.getElementById("cursor");
    const cursorDot = document.getElementById("cursor-dot");

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;
    let dotX = mouseX;
    let dotY = mouseY;

    document.addEventListener("mousemove", (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    const hovers = document.querySelectorAll("a, button, .lang-btn, .contact-btn");
    hovers.forEach(el => {
      el.addEventListener("mouseenter", () => {
        if (cursor) cursor.classList.add("hover");
      });
      el.addEventListener("mouseleave", () => {
        if (cursor) cursor.classList.remove("hover");
      });
    });

    // ==========================================
    // THREE.JS 3D CANVAS FOR SERVICE PAGE
    // ==========================================
    let scene, camera, renderer, activeMesh;
    const container = document.querySelector(".detail-3d");
    const canvas = document.getElementById("detail-canvas");

    function initThree() {
      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 0, 3.5);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Orbit controls
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enableZoom = false;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); // Increased ambient light wash
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00f3ff, 2.2); // Key Light (Cyan)
      dirLight.position.set(5, 5, 2);
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 1.5); // Fill Light (White)
      fillLight.position.set(-5, 5, 4);
      scene.add(fillLight);

      const ptLight = new THREE.PointLight(0x00f3ff, 2.0, 10); // Subtle Cyan point accent
      ptLight.position.set(-3, 2, -2);
      scene.add(ptLight);

      // Create geometry based on service selection
      let geometry;
      const geomType = activeService.geometry;

      if (geomType === 'sphere') {
        geometry = new THREE.SphereGeometry(0.8, 64, 64);
      } else if (geomType === 'cube') {
        geometry = new THREE.BoxGeometry(1, 1, 1);
      } else if (geomType === 'cylinder') {
        geometry = new THREE.CylinderGeometry(0.6, 0.6, 1.2, 32);
      } else if (geomType === 'torus') {
        geometry = new THREE.TorusGeometry(0.6, 0.25, 16, 100);
      } else {
        geometry = new THREE.TorusKnotGeometry(0.5, 0.18, 120, 16);
      }

      const material = new THREE.MeshStandardMaterial({
        color: geomType === 'sphere' ? 0x00f3ff : 0x06b6d4,
        roughness: 0.35, // Adjusted to spread highlights better
        metalness: 0.6,  // Adjusted to prevent solid black silhouettes
        wireframe: false
      });

      activeMesh = new THREE.Mesh(geometry, material);
      scene.add(activeMesh);

      // Scale-in intro animation
      gsap.from(activeMesh.scale, { x: 0, y: 0, z: 0, duration: 1.5, ease: "back.out(1.7)" });
      gsap.from(activeMesh.rotation, { x: Math.PI, y: Math.PI, duration: 1.5 });

      window.addEventListener("resize", () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      function animate() {
        requestAnimationFrame(animate);

        // GPU-Accelerated Custom Cursor Lerping
        cursorX += (mouseX - cursorX) * 0.12;
        cursorY += (mouseY - cursorY) * 0.12;
        dotX += (mouseX - dotX) * 0.45;
        dotY += (mouseY - dotY) * 0.45;

        if (cursor) {
          cursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0) translate(-50%, -50%)`;
        }
        if (cursorDot) {
          cursorDot.style.transform = `translate3d(${dotX}px, ${dotY}px, 0) translate(-50%, -50%)`;
        }

        controls.update();

        const time = Date.now() * 0.001;
        if (activeMesh && !controls.state === 1) {
          activeMesh.rotation.y = time * 0.3;
          activeMesh.rotation.x = time * 0.15;
          activeMesh.position.y = Math.sin(time * 1.2) * 0.08;
        }

        renderer.render(scene, camera);
      }

      animate();
    }

    initThree();
  </script>
</body>
</html>
